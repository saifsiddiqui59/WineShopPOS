name: WineShopPOS PROD Website Stop (Reversible)
# User-requested website pause while redesigning premium login graphics.
# Only the existing PROD static website. No database, function, or DEV writes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wineshoppos-prod-safe-stop.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stop-prod-web:
    runs-on: ubuntu-latest
    environment: wineshoppos-deploy
    timeout-minutes: 8
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Disable only WineShopPOS PROD static website and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_SUB="3a5e8018-40a4-49e3-bcba-a9af3344f50e"
          RG="wineshopPOS"
          ACCOUNT="wineshoppos"
          URL="https://wineshoppos.z29.web.core.windows.net/"
          echo "## WineShopPOS production website stop" >> "$GITHUB_STEP_SUMMARY"
          CURRENT_SUB=$(az account show --query id -o tsv)
          [[ "${CURRENT_SUB,,}" == "${EXPECTED_SUB,,}" ]] || {
            echo "::error::Unexpected subscription; no changes made"; exit 1;
          }
          ACTUAL_URL=$(az storage account show -g "$RG" -n "$ACCOUNT" --query primaryEndpoints.web -o tsv)
          [[ "$ACTUAL_URL" == "$URL" ]] || {
            echo "::error::Unexpected website endpoint; no changes made"; exit 1;
          }
          STATE=$(az storage account blob-service-properties show -g "$RG" -n "$ACCOUNT" --query staticWebsite.enabled -o tsv)
          echo "Previous PROD static website setting: ${STATE}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${STATE,,}" != "false" ]]; then
            az storage account blob-service-properties update -g "$RG" -n "$ACCOUNT" --enable-static-website false -o none
          fi
          FINAL=$(az storage account blob-service-properties show -g "$RG" -n "$ACCOUNT" --query staticWebsite.enabled -o tsv)
          [[ "${FINAL,,}" == "false" ]] || {
            echo "::error::Could not verify the website was disabled"; exit 1;
          }
          echo "PROD_STATIC_WEBSITE_DISABLED_CONFIRMED"
          echo "Site: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: DISABLED — customer web access unavailable while redesign proceeds" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure Functions and email Logic App: NOT STOPPED (GitHub identity lacks Microsoft.Web/sites/read)" >> "$GITHUB_STEP_SUMMARY"
          echo "Supabase: UNTOUCHED" >> "$GITHUB_STEP_SUMMARY"
          echo "DEV/QA: UNTOUCHED" >> "$GITHUB_STEP_SUMMARY"
