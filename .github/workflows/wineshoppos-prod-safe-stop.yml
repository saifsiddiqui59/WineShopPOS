name: WineShopPOS PROD Safe Low-Cost Stop

# User-requested reversible production shutdown before redesigning login artwork.
# ONLY existing PROD Azure resources; Supabase and DEV/QA untouched.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wineshoppos-prod-safe-stop.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wineshoppos-prod-operational-control
  cancel-in-progress: false

jobs:
  safe-stop:
    name: Disable PROD static website, automation and Functions (leave data intact)
    environment: wineshoppos-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate exact PROD targets and perform reversible stop
        shell: bash
        run: |
          set -Eeuo pipefail
          RG="wineshopPOS"
          WEB="wineshoppos"
          EXPECTED_WEB="https://wineshoppos.z29.web.core.windows.net/"
          INVOICE="wsp-v3-invoice-53b6e9a1"
          AI="wineshoppos-ai-1a61d5885c"
          LOGIC="wsp-v3-email-scheduler-53b6e9a1"
          SUB="3a5e8018-40a4-49e3-bcba-a9af3344f50e"

          echo "## WineShopPOS PROD low-cost reversible STOP" >> "$GITHUB_STEP_SUMMARY"
          echo "Requested before login artwork redesign; Supabase remains untouched." >> "$GITHUB_STEP_SUMMARY"
          CURRENT_SUB=$(az account show --query id -o tsv)
          [[ "${CURRENT_SUB,,}" == "${SUB,,}" ]] || {
            echo "::error::Azure subscription differs from recorded WineShopPOS subscription. No changes made."
            exit 1
          }
          CURRENT_WEB=$(az storage account show -g "$RG" -n "$WEB" --query primaryEndpoints.web -o tsv)
          [[ "$CURRENT_WEB" == "$EXPECTED_WEB" ]] || {
            echo "::error::Unexpected storage endpoint. No changes made."
            exit 1
          }
          for NAME in "$INVOICE" "$AI"; do
            az functionapp show -g "$RG" -n "$NAME" -o none || {
              echo "::error::Required PROD Function missing: $NAME. No changes made."
              exit 1
            }
          done
          echo "Target validation: PASS (only wineshopPOS / PROD)" >> "$GITHUB_STEP_SUMMARY"

          # Keep production unpublished during the offline redesign.
          az storage account blob-service-properties update -g "$RG" -n "$WEB" \
            --enable-static-website false -o none
          SITE=$(az storage account blob-service-properties show -g "$RG" -n "$WEB" --query staticWebsite.enabled -o tsv)
          [[ "${SITE,,}" == "false" ]] || { echo "::error::Unable to verify website disabled"; exit 1; }
          echo "PROD static website: DISABLED" >> "$GITHUB_STEP_SUMMARY"

          # Disable external emails before shutting down the Functions.
          if az resource show -g "$RG" -n "$LOGIC" --resource-type Microsoft.Logic/workflows -o none 2>/dev/null; then
            az resource update -g "$RG" -n "$LOGIC" \
              --resource-type Microsoft.Logic/workflows \
              --set properties.state=Disabled -o none
            LS=$(az resource show -g "$RG" -n "$LOGIC" --resource-type Microsoft.Logic/workflows --query properties.state -o tsv)
            [[ "$LS" == "Disabled" ]] || { echo "::error::Email Logic App not disabled"; exit 1; }
            echo "PROD email Logic App: Disabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PROD email Logic App: ABSENT" >> "$GITHUB_STEP_SUMMARY"
          fi

          az functionapp config appsettings set -g "$RG" -n "$INVOICE" \
            --settings EMAIL_POLL_ENABLED=false "AzureWebJobs.email-invoice-poller.Disabled=true" -o none
          echo "Invoice automatic email polling: DISABLED" >> "$GITHUB_STEP_SUMMARY"

          for NAME in "$INVOICE" "$AI"; do
            CURRENT=$(az functionapp show -g "$RG" -n "$NAME" --query state -o tsv)
            if [[ "$CURRENT" != "Stopped" ]]; then
              az functionapp stop -g "$RG" -n "$NAME" -o none
            fi
          done

          FAILED=0
          for NAME in "$INVOICE" "$AI"; do
            STATE=""
            for _ in $(seq 1 20); do
              STATE=$(az functionapp show -g "$RG" -n "$NAME" --query state -o tsv || true)
              [[ "$STATE" == "Stopped" ]] && break
              sleep 3
            done
            echo "$NAME state: $STATE" >> "$GITHUB_STEP_SUMMARY"
            [[ "$STATE" == "Stopped" ]] || FAILED=1
          done
          [[ "$FAILED" == 0 ]] || { echo "::error::At least one Function did not stop"; exit 1; }

          FINAL_SITE=$(az storage account blob-service-properties show -g "$RG" -n "$WEB" --query staticWebsite.enabled -o tsv)
          [[ "${FINAL_SITE,,}" == "false" ]] || { echo "::error::Static site reenabled unexpectedly"; exit 1; }
          echo "PROD_SAFE_STOP_SUCCEEDED"
          echo "Supabase: NOT MODIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "DEV/QA: NOT MODIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "Resources remain allocated; storage and other residual charges may continue." >> "$GITHUB_STEP_SUMMARY"
