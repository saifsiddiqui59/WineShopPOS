name: WineShopPOS PROD Animated Login Release

# One-time production UI-only rollout. Trigger when this workflow is added to main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wineshoppos-prod-login-release.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: wineshoppos-prod-frontend-release
  cancel-in-progress: false

jobs:
  release:
    name: Exact PROD build, rollback snapshot, deploy and login browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: wineshoppos-deploy
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Azure login using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Recover public PROD config, build and back up existing Azure index
        shell: bash
        run: bash scripts/ops/wsp-prod-login-prepare.sh

      - name: Store rollback artifact BEFORE any cloud overwrite
        uses: actions/upload-artifact@v4
        with:
          name: wsp-prod-login-rollback-${{ github.sha }}
          path: artifacts/prod-login-backup/
          retention-days: 30
          if-no-files-found: error

      - name: Upload new immutable assets, publish frontend, verify, auto-rollback on failure
        shell: bash
        run: bash scripts/ops/wsp-prod-login-deploy.sh

